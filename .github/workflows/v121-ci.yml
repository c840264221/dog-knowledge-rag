name: V1.21 Python and Docker CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v121-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python Compile and Test
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install CI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-ci.txt

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q src tests scripts

      - name: Run full pytest suite
        shell: pwsh
        run: |
          python -m pytest -q

  docker-build:
    name: Docker Image Build
    needs:
      - python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate release Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f compose.release.yaml \
            config --quiet
          rm .env

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: dog-agent-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
